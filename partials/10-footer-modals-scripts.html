<!-- Calendly modal -->
<div id="calendly-modal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.55);align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border-radius:18px;width:92%;max-width:480px;height:82vh;position:relative;overflow:hidden;display:flex;flex-direction:column;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;">
            <span style="font-weight:700;font-size:16px;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><rect x="3.5" y="5" width="17" height="16" rx="2.2"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3.5 10h17"/></svg> קביעת פגישה</span>
            <button onclick="closeCalendlyModal()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-secondary);line-height:1;">&times;</button>
        </div>
        <div id="calendly-inline-container" style="flex:1;min-width:320px;"></div>
    </div>
</div>

<script>
// ── Calendly modal ──────────────────────────────
const CALENDLY_URL = 'https://calendly.com/ori-israel555/coaching';

function openCalendlyModal() {
    const modal = document.getElementById('calendly-modal');
    const container = document.getElementById('calendly-inline-container');
    container.innerHTML = '';
    modal.style.display = 'flex';
    document.querySelector('.hamburger-menu') && document.querySelector('.hamburger-menu').classList.remove('open');

    if (window.Calendly) {
        Calendly.initInlineWidget({ url: CALENDLY_URL, parentElement: container });
    } else {
        const script = document.createElement('script');
        script.src = 'https://assets.calendly.com/assets/external/widget.js';
        script.onload = () => Calendly.initInlineWidget({ url: CALENDLY_URL, parentElement: container });
        script.onerror = () => {
            container.innerHTML = `<iframe src="${CALENDLY_URL}" width="100%" height="100%" style="border:none;" allow="payment"></iframe>`;
        };
        document.head.appendChild(script);
    }
}

function closeCalendlyModal() {
    document.getElementById('calendly-modal').style.display = 'none';
}

document.getElementById('calendly-modal').addEventListener('click', function(e) {
    if (e.target === this) closeCalendlyModal();
});

// ── Calendly event listener ─────────────────────
window.addEventListener('message', async function(e) {
    if (!e.data || e.data.event !== 'calendly.event_scheduled') return;

    const eventUri = e.data.payload?.event?.uri;
    let startTime = null;

    if (eventUri) {
        try {
            const { data: { session: _calSession } } = await db.auth.getSession();
            const _calToken = _calSession?.access_token;
            const resp = await fetch('/api/calendly-event', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(_calToken ? { 'Authorization': `Bearer ${_calToken}` } : {})
                },
                body: JSON.stringify({ eventUri })
            });
            const json = await resp.json();
            if (json.startTime) startTime = json.startTime;
        } catch {}
    }

    if (!startTime) startTime = new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString();

    CLIENT.nextMeetingDate = startTime;
    const data = JSON.parse(localStorage.getItem('profile_data_v1') || '{}');
    data.nextMeetingDate = startTime;
    localStorage.setItem('profile_data_v1', JSON.stringify(data));

    const uid = typeof getActiveUserId === 'function' ? getActiveUserId() : null;
    if (uid) sbUpsertProfile(uid, { next_meeting_date: startTime }).catch(() => {});

    document.getElementById('meeting-reminder-banner').style.display = 'none';
    closeCalendlyModal();
});

// ── Reminder logic ──────────────────────────────
function checkMeetingReminder() {
    if (CLIENT.isSubscriber) return;
    const durationMonths = CLIENT.coachingDurationMonths;
    if (!durationMonths) return;

    const startDate = CLIENT.startDate;
    if (!startDate) return;

    // Is coaching still active?
    const start = new Date(startDate);
    const end = new Date(start);
    end.setMonth(end.getMonth() + parseInt(durationMonths));
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    if (today > end) return;

    // Show banner from day 11 to day 15 after last meeting (4-day window)
    const nextMeeting = CLIENT.nextMeetingDate ? new Date(CLIENT.nextMeetingDate) : null;
    if (!nextMeeting) {
        // No meeting booked yet — always show
        document.getElementById('meeting-reminder-banner').style.display = 'flex';
        return;
    }
    const meetingDay = new Date(nextMeeting);
    meetingDay.setHours(0, 0, 0, 0);
    const daysAfter = Math.floor((today - meetingDay) / 86400000);
    if (daysAfter < 11) return;  // too early
    if (daysAfter > 15) return;  // 4-day window expired

    document.getElementById('meeting-reminder-banner').style.display = 'flex';
}

function dismissMeetingReminder() {
    // Dismiss for this session only (no localStorage)
    document.getElementById('meeting-reminder-banner').style.display = 'none';
}

// checkMeetingReminder is called from reinitApp() in auth.js after data loads
</script>
</body>
</html>
