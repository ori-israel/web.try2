<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>פורטל ליווי אישי - תוכנית עבודה</title>
    <meta name="description" content="פורטל ליווי אישי לתזונה ואימונים — מעקב יומי, שאלון התקדמות וסריקת מזון חכמה במקום אחד.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&display=swap"></noscript>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/OI-2.192.192.png">
    <link rel="apple-touch-icon" href="/OI.512.512.png">
    <script>
        // ניקוי חד-פעמי למכשירים שנתקעו עם מטמון ישן מלפני התיקון (2026-07-09) — רץ פעם אחת בלבד לכל דפדפן, לא חוזר
        (async function () {
            try {
                const KEY = 'oi_cache_purge_v1';
                if (localStorage.getItem(KEY)) return;
                localStorage.setItem(KEY, '1');
                let purged = false;
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    if (regs.length) { await Promise.all(regs.map(r => r.unregister())); purged = true; }
                }
                if ('caches' in window) {
                    const keys = await caches.keys();
                    if (keys.length) { await Promise.all(keys.map(k => caches.delete(k))); purged = true; }
                }
                if (purged) { location.reload(); return; }
            } catch (e) { /* ignore */ }
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    // updateViaCache:'none' — תמיד לבדוק את sw.js מהרשת, לא מהמטמון
                    const reg = await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
                    // מכריח בדיקת עדכון בכל טעינה
                    reg.update().catch(() => {});
                    // בודק שוב כל 60 שניות כל עוד הדף פתוח
                    setInterval(() => reg.update().catch(() => {}), 60000);
                } catch (e) { /* ignore */ }
            });
            // כשגרסה חדשה משתלטת — רענון פעם אחת כדי לטעון קוד טרי (עם נעילה נגד לולאה)
            let _swReloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (_swReloaded) return;
                _swReloaded = true;
                window.location.reload();
            });
        }
    </script>
</head>
