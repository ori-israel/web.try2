   <div id="tab1" class="tab-content active">
        <div class="nutrition-header-top">
            <h2 class="nutrition-title">מעקב תזונה יומי</h2>
            <div class="nutrition-header-btns">
                <div id="nutrition-streak-display" class="nutrition-streak-badge">
                    <span class="streak-fire" style="display:inline-flex;width:22px;height:22px;border-radius:50%;background:rgba(249,115,22,0.14);align-items:center;justify-content:center;flex-shrink:0;"><svg viewBox="0 0 24 24" width="13" height="13" fill="#f97316" stroke="#f97316" stroke-width="1" stroke-linejoin="round"><path d="M12 2.5c-1.2 3.3-5 5.7-5 9.5a5 5 0 0 0 10 0c0-1.6-.7-2.9-1.8-4 .1 1.7-.9 2.4-1.6 2 .9-2 -.2-4.2-1.6-7.5z"/></svg></span>
                    <span class="streak-number" id="nutrition-streak-count">0</span>
                    <span class="streak-unit">ימים</span>
                </div>
                <button class="tour-inline-btn" onclick="startTabTour('tab1')" title="מדריך לטאב" aria-label="מדריך לטאב"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v14"/><path d="M12 6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v13.5"/><path d="M4 19.5h16"/><path d="M6.5 6.5h3"/><path d="M6.5 9.5h3"/><path d="M14.5 6.5h3"/><path d="M14.5 9.5h3"/></svg></button>
            </div>
        </div>

        <!-- ה-Dashboard היומי (גרמים) -->
        <div id="macros-dashboard">
            <div id="macros-progress-group">
                <div class="daily-kcal-block">
                    <div class="daily-kcal-num"><span id="kcal-val">0</span><span class="daily-kcal-target">/ <span id="kcal-target">0</span></span></div>
                    <div class="daily-kcal-lbl">קלוריות היום</div>
                </div>
                <div class="macro-progress-row">
                    <div class="macro-progress-top">
                        <div class="macro-progress-name"><span class="macro-dot dot-protein"></span>חלבון</div>
                        <div class="macro-progress-nums"><span id="protein-val">0</span><span class="macro-card-target" id="protein-target">/ 0</span> גרם</div>
                    </div>
                    <div class="macro-progress-track"><div class="macro-progress-fill fill-protein portion-progress-bar" id="protein-progress-bar"></div></div>
                </div>
                <div class="macro-progress-row">
                    <div class="macro-progress-top">
                        <div class="macro-progress-name"><span class="macro-dot dot-carbs"></span>פחמימה</div>
                        <div class="macro-progress-nums"><span id="carbs-val">0</span><span class="macro-card-target" id="carbs-target">/ 0</span> גרם</div>
                    </div>
                    <div class="macro-progress-track"><div class="macro-progress-fill fill-carbs portion-progress-bar" id="carbs-progress-bar"></div></div>
                </div>
                <div class="macro-progress-row">
                    <div class="macro-progress-top">
                        <div class="macro-progress-name"><span class="macro-dot dot-fat"></span>שומן</div>
                        <div class="macro-progress-nums"><span id="fat-val">0</span><span class="macro-card-target" id="fat-target">/ 0</span> גרם</div>
                    </div>
                    <div class="macro-progress-track"><div class="macro-progress-fill fill-fat portion-progress-bar" id="fat-progress-bar"></div></div>
                </div>
            </div>
        </div><!-- /macros-dashboard -->

        <!-- שורת פעולות: הוספת אוכל / מה אכלתי היום / המזונות שלי -->
        <div class="food-action-row">
            <button class="food-action-tile primary" onclick="openFoodScanner()">
                <span class="food-action-ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>
                <span class="food-action-lb">הוספת אוכל</span>
            </button>
            <button class="food-action-tile" onclick="toggleAccordion('food-log-accordion')">
                <span class="food-action-ic" style="background:rgba(59,130,246,0.14);color:var(--accent-dark);"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19.5" cy="18" r="1" fill="currentColor" stroke="none"/></svg></span>
                <span class="food-action-lb">מה אכלתי היום?</span>
            </button>
            <button class="food-action-tile" onclick="openMyFoods()">
                <span class="food-action-ic" style="background:rgba(52,211,153,0.14);color:#34d399;"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-3.5L6 20z"/></svg></span>
                <span class="food-action-lb">המזונות שלי</span>
            </button>
        </div>
        <div id="food-log-accordion" class="accordion-content food-log-content">
            <div id="food-log-nav"></div>
            <div id="food-log-list" style="font-size:14px;"></div>
        </div>

        <!-- הצעת ארוחה מהמאמן AI -->
        <button class="meal-idea-card" onclick="openMealIdeaChat()">
            <span class="meal-idea-avatar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 3.5V16H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 10.5h.01"/><path d="M12 10.5h.01"/><path d="M16 10.5h.01"/></svg></span>
            <span class="meal-idea-body">
                <span class="meal-idea-who">המאמן AI</span>
                <span class="meal-idea-msg">רוצה רעיון לארוחה? אפשר להחליט ביחד.</span>
            </span>
            <span class="meal-idea-chev"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </button>

        <!-- כפתור המחשבון הועבר לסוף הטאב -->
        <button class="calc-btn" onclick="openCalc()" style="background-color: var(--dark-green); margin-top: 25px; width: 100%;display:flex;align-items:center;justify-content:center;gap:6px;"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><rect x="4" y="13" width="4" height="7" rx="1"/><rect x="10" y="8" width="4" height="12" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/></svg> מחשבון תזונה</button>
    </div>

    <!-- המחשבון כ-Overlay עם הערכים המדויקים מהקוד הישן -->
<div id="calc-overlay" class="overlay" style="display:none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); overflow-y: auto; padding-top: 50px;">
    <div class="card" style="background:var(--bg-card,#1e1e1e); margin: auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 15px; position: relative; direction: rtl;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--light-green); padding-bottom: 10px;">
            <h2 style="margin:0; color: var(--dark-green); font-size: 1.2rem;display:flex;align-items:center;gap:6px;"><svg viewBox="0 0 24 24" width="16" height="16" fill="var(--accent)"><rect x="4" y="13" width="4" height="7" rx="1"/><rect x="10" y="8" width="4" height="12" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/></svg> מחשבון תזונה</h2>
            <button onclick="closeCalc()" style="background: none; border: none; font-size: 28px; cursor: pointer; color: #888;">&times;</button>
        </div>

        <fieldset style="margin-bottom: 15px;">
            <legend style="margin-bottom: 8px; font-weight: bold;">מין:</legend>
            <div style="display: flex; gap: 20px;">
                <label><input type="radio" name="gender" value="male" checked> גבר</label>
                <label><input type="radio" name="gender" value="female"> אישה</label>
            </div>
        </fieldset>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <input type="number" id="calc-age" placeholder="גיל" aria-label="גיל" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
            <input type="number" id="calc-height" placeholder="גובה (ס״מ)" aria-label="גובה בסנטימטרים" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
        </div>
        <input type="number" id="calc-weight" placeholder="משקל נוכחי (ק״ג)" aria-label="משקל נוכחי בקילוגרמים" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px;">
        
        <fieldset style="margin-bottom: 20px;">
        <legend style="margin-bottom: 8px; font-weight: bold;">רמת פעילות גופנית:</legend>
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <label><input type="radio" name="activity" value="1.2" checked> לא עושה פעילות גופנית בכלל</label>
            <label><input type="radio" name="activity" value="1.375"> 1-3 אימונים בשבוע</label>
            <label><input type="radio" name="activity" value="1.465"> 4-5 אימונים בשבוע</label>
            <label><input type="radio" name="activity" value="1.55"> 6 אימונים בשבוע</label>
            <label><input type="radio" name="activity" value="1.725"> פעילות אינטנסיבית יום יומית</label>
        </div>
        </fieldset>

        <button class="calc-btn" onclick="calculateStats()" style="width: 100%; background-color: var(--dark-green); color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">חשב נתונים</button>
        
        <div id="calc-result" style="display:none; margin-top: 20px; padding: 15px; background: var(--bg-card-alt,#2a2a2a); border-radius: 10px; border-right: 4px solid var(--dark-green); line-height: 1.6;">
            <p id="res-bmi" style="margin: 5px 0;"></p>
            <p id="res-protein" style="margin: 5px 0;"></p>
            <p id="res-maintenance" style="margin: 5px 0;"></p>
            <p id="res-cut" style="margin: 5px 0; color: #d9534f;"></p>
            <p id="res-bulk" style="margin: 5px 0; color: #5cb85c;"></p>
        </div>
    </div>
</div>
