name: עדכון מאגר ברקודים שבועי

on:
  schedule:
    - cron: '0 3 * * 0'  # כל יום ראשון ב-03:00 UTC
  workflow_dispatch: {}  # אפשר גם להריץ ידנית מטאב Actions בגיטהאב

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת תלויות
        run: pip install -r scripts/requirements.txt

      - name: הרצת הסקרייפר
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/barcode_scraper.py
